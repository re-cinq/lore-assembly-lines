name: pack-lint
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # floor-pipeline reads the host keys from floor-collection.yaml, which Lore's export writes.
      - run: npx --yes @re-cinq/floor-pipeline@0.6.1 lint .
